<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>走丢了 · wayfarer</title>
<style>
  *{ margin:0; padding:0; box-sizing:border-box; }
  body{
    background:#07070c; color:#eceaf2; min-height:100vh;
    display:flex; align-items:center; justify-content:center;
    font-family:-apple-system,BlinkMacSystemFont,"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
    text-align:center; padding:24px; overflow:hidden; position:relative;
  }
  .glow{ position:absolute; width:640px; height:640px; border-radius:50%;
    background:radial-gradient(circle, rgba(167,139,250,.10), transparent 65%);
    filter:blur(20px); animation:drift 12s ease-in-out infinite alternate; }
  @keyframes drift{ from{ transform:translate(-40px,-30px);} to{ transform:translate(40px,30px);} }
  .wrap{ position:relative; z-index:2; }
  .code{ font-size:clamp(90px,18vw,170px); font-weight:200; letter-spacing:.12em;
    color:transparent; -webkit-text-stroke:1px rgba(167,139,250,.55); line-height:1; }
  h1{ font-size:clamp(26px,4vw,38px); font-weight:300; letter-spacing:.3em; margin:30px 0 22px; }
  p{ color:#8f8b9e; font-size:15px; line-height:2.4; letter-spacing:.08em; margin-bottom:44px; }
  a{ display:inline-block; color:#eceaf2; text-decoration:none; font-size:14px; letter-spacing:.34em;
    border:1px solid rgba(255,255,255,.18); border-radius:999px; padding:15px 42px 15px 48px;
    transition:all .3s; }
  a:hover{ border-color:#ea4c88; box-shadow:0 0 30px rgba(234,76,136,.25); transform:translateY(-2px); }
  .foot{ margin-top:70px; font-size:11px; letter-spacing:.5em; color:#3c3a45; }
</style>
</head>
<body>
<div class="glow"></div>
<div class="wrap">
  <div class="code">404</div>
  <h1>走 丢 了 ?</h1>
  <p>没关系，这座城市很大，慢慢找。<br>灯还亮着，路还在。</p>
  <a href="/">回 到 起 点 →</a>
  <div class="foot">WAYFARER · 在空城里独行</div>
</div>
</body>
</html>
